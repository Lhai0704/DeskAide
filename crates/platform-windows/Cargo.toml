[package]
name = "deskaide-platform-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
deskaide-assistant-core = { path = "../assistant-core" }
deskaide-context-core = { path = "../context-core" }
tokio.workspace = true
uiautomation = { version = "0.25.0", default-features = false, features = ["input", "pattern"] }
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio.workspace = true
