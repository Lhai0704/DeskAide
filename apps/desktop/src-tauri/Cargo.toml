[package]
name = "deskaide-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "DeskAide Windows desktop assistant"

[lib]
name = "deskaide_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "deskaide"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait.workspace = true
tokio-util.workspace = true
tempfile = "3"
deskaide-assistant-runtime = { path = "../../../crates/assistant-runtime" }
deskaide-tool-core = { path = "../../../crates/tool-core" }
deskaide-mcp-client = { path = "../../../crates/mcp-client" }
deskaide-ai-provider = { path = "../../../crates/ai-provider" }
deskaide-assistant-core = { path = "../../../crates/assistant-core" }
deskaide-context-core = { path = "../../../crates/context-core" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
thiserror.workspace = true
tokio.workspace = true
url.workspace = true
uuid.workspace = true
reqwest = { version = "0.12.28", features = ["json", "stream"] }
futures-util = "0.3.31"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
deskaide-platform-windows = { path = "../../../crates/platform-windows" }
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
