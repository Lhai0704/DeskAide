[package]
name = "deskaide-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "DeskAide Windows desktop assistant"

[lib]
name = "deskaide_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "deskaide"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
deskaide-ai-provider = { path = "../../../crates/ai-provider" }
deskaide-assistant-core = { path = "../../../crates/assistant-core" }
deskaide-context-core = { path = "../../../crates/context-core" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
thiserror.workspace = true
tokio.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
deskaide-platform-windows = { path = "../../../crates/platform-windows" }
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
