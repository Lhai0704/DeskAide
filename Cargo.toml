[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/assistant-core",
  "crates/ai-provider",
  "crates/context-core",
  "crates/platform-windows",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
async-trait = "0.1.89"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.21.0", features = ["serde", "v4"] }

